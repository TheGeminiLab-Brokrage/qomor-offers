<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qomor Business Plaza — Offer Generator</title>
<meta name="theme-color" content="#0B1B2B">
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<!-- The masterplan render is the first thing anyone sees, but its src is set by
     renderHero() — which only runs once the inventory has parsed, so the image
     did not START downloading until then and the page sat empty for the whole
     fetch. Preloading it here begins the download with the HTML, in parallel
     with everything else. Kept as a preload rather than a src on the <img> so
     MASSING.image stays the single source of truth for which render is used. -->
<link rel="preload" as="image" href="assets/render.jpg" fetchpriority="high">
<!-- The inventory is the other thing on the critical path; warm the connection
     so the TLS handshake is not paid for after app.js finally runs. -->
<link rel="preconnect" href="https://docs.google.com" crossorigin>
</head>
<body>

<!-- The wordmark is the client's own, lifted from the catalogue cover. It is a
     light logo with a transparent background, so it only ever sits on the dark
     page — never invert it or put it on white. -->
<header id="top">
  <div class="brand">
    <!-- Image is the wordmark ONLY. The full lockup (assets/logo-full.png)
         carries "BUSINESS PLAZA" beneath it at a tenth of the logo height,
         which is an illegible smudge at header size — so the strapline is set
         as live text instead and stays crisp. -->
    <img class="logo" src="assets/logo.png" alt="Qomor" width="578" height="260">
    <div class="names">
      <b data-i18n="brand.strap">Business Plaza</b>
      <span id="brandBy">By El Shihry Developments</span>
    </div>
  </div>
  <!-- Arabic/English, as a two-segment switch showing BOTH codes with the
       active one lit. The previous control was a single button labelled with
       the language you would switch TO, which is the convention but is also
       the one control on the page people read backwards — "English" while you
       are reading Arabic is ambiguous unless you already know the convention.
       EN|AR states where you are and where you can go at the same time, and
       needs no translating. It stays in the physical top-right corner in both
       languages; see the row-reverse rule in the stylesheet. -->
  <div class="langsw" id="langSw" role="group">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ar">AR</button>
  </div>
</header>

<!-- Live sync status. The dot colour is the whole story at a glance:
     amber = live, red = stale/offline. -->
<div class="sync" id="sync">
  <span class="dot" id="syncDot"></span>
  <span id="syncText" data-i18n="sync.loading">Loading inventory…</span>
  <!-- Refresh belongs next to the timestamp it changes, not up in the header:
       the only reason to press it is that "updated 16:33" has gone stale, so
       the reading and the remedy now sit together. -->
  <button class="ghost tiny" id="btnRefresh" type="button" data-i18n="btn.refresh">Refresh</button>
  <span class="spacer"></span>
  <span id="syncCounts"></span>
</div>

<div id="warnings" class="warnings" hidden></div>

<main>
  <section class="step" id="stepBuilding">
    <h2><i>1</i> <span data-i18n="step.1">Building</span> <small data-i18n="step.1.hint">Tap a building on the view, or use the cards</small></h2>
    <!-- The masterplan picker. Its only output is selectBuilding(id) — the same
         call the cards make — so the render, a 3D view and a plain list stay
         interchangeable and nothing downstream knows which was used. -->
    <div id="hero">
      <img id="heroImg" alt="Qomor Business Plaza">
      <svg id="heroSvg" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <!-- Authored in viewBox units, where 1 = the whole image width. A CSS
               drop-shadow in px resolves in this same space and would smear at
               image scale. -->
          <filter id="glowF" x="-45%" y="-45%" width="190%" height="190%">
            <feDropShadow dx="0" dy="0" stdDeviation=".005" flood-color="#FFC27A" flood-opacity=".95"/>
            <feDropShadow dx="0" dy="0" stdDeviation=".016" flood-color="#FF9E3D" flood-opacity=".75">
              <!-- The halo breathes independently of the CSS flicker, so the two
                   drift in and out of phase and the light never looks looped. -->
              <animate attributeName="flood-opacity" values=".45;.9;.55;.85;.45"
                       dur="3.7s" repeatCount="indefinite"/>
            </feDropShadow>
          </filter>
          <!-- Hovering a building with nothing available still lights up — it
               just lights up cool instead of amber, so "look at me" and "you
               can buy me" stay different signals. -->
          <filter id="glowCool" x="-45%" y="-45%" width="190%" height="190%">
            <feDropShadow dx="0" dy="0" stdDeviation=".005" flood-color="#DCE6F2" flood-opacity=".9"/>
            <feDropShadow dx="0" dy="0" stdDeviation=".016" flood-color="#9FB4CC" flood-opacity=".6"/>
          </filter>
        </defs>
      </svg>
      <div id="heroTip"><b></b><i></i></div>
    </div>
    <!-- No cards: the render is the picker. This is just the current choice,
         and a way to switch without going back to the image. -->
    <div id="buildingBar">
      <span class="chip" id="buildingChip">—</span>
      <select id="buildingSel" data-i18n-attr="aria-label:building.switch"></select>
      <span id="buildingMeta"></span>
    </div>
  </section>

  <section class="step" id="stepFloor" hidden>
    <h2><i>2</i> <span data-i18n="step.2">Floor</span></h2>
    <div class="grid" id="floors"></div>
  </section>

  <section class="step" id="stepUnit" hidden>
    <h2><i>3</i> <span data-i18n="step.3">Unit</span> <small id="unitHint"></small></h2>
    <!-- The drawing is the selector; the side panel is the way to find a unit
         by number rather than by eye. Two routes to the same selectUnit(). -->
    <div id="unitLayout">
      <div>
        <!-- The plan shows available and reserved; everywhere else in the app
             still shows available only. A reserved pin carries its status, not
             a price — a unit that is not for sale has no business showing its
             price to a customer sitting beside the agent. -->
        <div class="legend">
          <span><i class="sw available"></i><span data-i18n="plan.legend">Available</span></span>
          <span><i class="sw reserved"></i><span data-i18n="plan.legendHeld">Reserved</span></span>
          <span class="spacer"></span>
          <!-- Zoom. The pins scale WITH the drawing, so the 6px target and the
               6.73px closest gap keep their ratio at every level — no overlap
               at any zoom, and at 4x a 24px target, which is a fingertip rather
               than mouse work. That is the whole reason this control exists. -->
          <button class="ghost small zoombtn" id="planZoomOut" type="button"
                  data-i18n-attr="aria-label:plan.zoomOut" aria-label="Zoom out">&minus;</button>
          <b id="planZoomLevel">100%</b>
          <button class="ghost small zoombtn" id="planZoomIn" type="button"
                  data-i18n-attr="aria-label:plan.zoomIn" aria-label="Zoom in">+</button>
        </div>
        <!-- Sold pins are RED: a grey "sold" reads too close to a grey
             "not released". -->
        <div id="planWrap">
          <!-- planStage is what zooms. The drawing and the pins scale together
               because both are sized in percentages of this box, so a pin
               cannot drift off its room at any zoom. planTip stays OUTSIDE the
               stage, positioned against planWrap, so the label keeps its
               readable size instead of being magnified with the drawing. -->
          <div id="planStage">
            <img id="planImg" alt="">
            <!-- Pins are positioned buttons, not SVG. The new drawings are
                 2.04:1, and the old SVG overlay stretched to fit with
                 preserveAspectRatio="none", which squashed every circle into a
                 13x6px ellipse — unreadable as a dot and far too small to tap.
                 A button placed at left/top percentages stays round at any
                 aspect and keeps a fixed-size touch target. -->
            <div id="planPins"></div>
          </div>
          <div id="planTip"><b></b><i></i></div>
        </div>
        <p class="empty" id="planNote" hidden></p>
      </div>

      <aside id="unitPanel">
        <div class="panelhead">
          <p id="fltCount"></p>
          <!-- Closed until asked for: most of the time the agent wants the list,
               not the controls. -->
          <details id="fltBox">
            <summary data-i18n="filter.title">Filter &amp; sort</summary>
            <label>
              <span data-i18n="filter.type">Type</span>
              <!-- Options are rebuilt by renderUnits() from the sheet's own
                   types, so they are translated there, not here. -->
              <select id="fltType"></select>
            </label>
            <label>
              <span data-i18n="filter.sort">Sort</span>
              <select id="fltSort">
                <option value="unit" data-i18n="sort.unit">Unit number</option>
                <option value="price" data-i18n="sort.price">Price, low to high</option>
                <option value="price-desc" data-i18n="sort.price-desc">Price, high to low</option>
                <option value="area" data-i18n="sort.area">Area, small to large</option>
                <option value="area-desc" data-i18n="sort.area-desc">Area, large to small</option>
              </select>
            </label>
          </details>
        </div>
        <div id="units"></div>
      </aside>
    </div>
  </section>

  <section class="step" id="stepPlan" hidden>
    <h2><i>4</i> <span data-i18n="step.4">Unit details</span> <small data-i18n="step.4.hint">Price, payment plan and the offer</small></h2>
    <div class="unitcard" id="unitCard"></div>
    <div class="plans" id="plans"></div>
    <div id="schedule"></div>
    <div class="offerbar">
      <button class="cta" id="btnOffer" type="button" data-i18n="offer.send">Send offer on WhatsApp</button>
      <span id="offerNote"></span>
    </div>
  </section>
</main>

<footer>
  <p id="assumptions"></p>
</footer>

<!-- jsPDF is vendored rather than loaded from a CDN: this app is used in
     meetings on whatever connection the room has, and an offer that fails to
     generate because a CDN is slow is worse than a slightly larger download.

     It is NOT loaded here. At 410 KB it was the single biggest thing on the
     critical path, and because scripts execute in order it had to finish
     downloading and parsing before app.js could even start fetching the
     inventory — on a phone hotspot that alone was most of a two-minute wait.
     js/pdf.js pulls it in on demand, and app.js prefetches it once the page is
     idle, so the first offer is still instant. -->
<!-- i18n first: config.js is untouched English (it is the source of truth and
     the tests assert on it), and everything drawn on screen is translated at
     render time on top of it. See the header comment in js/i18n.js. -->
<script src="js/i18n.js"></script>
<!-- Arabic for the PDF, and the shaper that makes it drawable. Both are small
     and both are needed before the first export; the 376 KB Arabic FONT is the
     part that loads lazily, and only for an Arabic offer. -->
<script src="js/arabic.js"></script>
<script src="js/pdf-ar.js"></script>
<script src="js/config.js"></script>
<script src="js/plan.js"></script>
<script src="js/sheet.js"></script>
<script src="js/engine.js"></script>
<!-- Analytics. Inert until CONFIG.telemetry carries a url and key, and it can
     never break an offer — see the three rules at the top of the file. -->
<script src="js/telemetry.js"></script>
<script src="js/pdf.js"></script>
<script src="js/app.js"></script>
<!-- The service worker makes the app open without a connection and makes the
     browser offer "install to home screen". It never caches the inventory —
     see the rule at the top of sw.js. Skipped on file://, where registration
     throws, and on a failure it is a no-op: the app works fine without it. -->
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch((err) => console.warn('service worker:', err.message));
  });
}
</script>
</body>
</html>
